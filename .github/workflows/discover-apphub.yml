# Finds applications on AppImageHub (the openDesktop/Pling store) whose download
# resolves to a stable URL and that are not in the catalog yet, and proposes each
# as a new entry in its own pull request (label auto-discovered), for a
# maintainer to review. Never merges on its own: publish-pr-screenshot.yml's
# auto-merge skips these PRs.
#
# code/discover-apphub.sh reads the OCS v1 API at api.opendesktop.org, resolves
# each entry's (tokenized, expiring) Pling download link to its final URL, and
# proposes only the ones that land on a stable location (a GitHub/GitLab/Codeberg
# repository, a download directory, or a "latest" AppImage link). Manual only.

name: Discover AppImageHub

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of pull requests to open; the run scans AppImageHub (highest rated first) until it has found that many'
        type: number
        default: 1
      dry_run:
        description: 'Dry run (only print what would be opened; nothing is pushed or changed)'
        type: boolean
        default: false

jobs:
  discover-apphub:
    if: github.repository == 'AppImage/appimage.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 120 # the script stops scanning after 1 h (APPHUB_MAX_SECONDS) by default
    # One run at a time, so that two runs cannot propose the same app.
    concurrency:
      group: discover-apphub
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      # A personal token lets the opened PR's Test workflow actually start
      # (a PR opened with this workflow's own token starts none): DISCOVER_TOKEN
      # if set, else the SCREENSHOT_UPLOAD_TOKEN secret, else GITHUB_TOKEN (then
      # the PR body says to close and reopen it). See MAINTAINER.md.
      DISCOVER_TOKEN: ${{ secrets.DISCOVER_TOKEN }}
      SCREENSHOT_UPLOAD_TOKEN: ${{ secrets.SCREENSHOT_UPLOAD_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover and propose new entries
        env:
          COUNT: ${{ github.event.inputs.count || '1' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=(--count "$COUNT")
          [ "$DRY_RUN" == "true" ] && ARGS+=(--dry-run)
          bash code/discover-apphub.sh "${ARGS[@]}"
