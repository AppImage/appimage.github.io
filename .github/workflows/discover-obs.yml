# Finds applications published as AppImages on the openSUSE Build Service and
# proposes the ones not in the catalog yet as pull requests (labeled
# auto-discovered), for a maintainer to review. Run by hand from the Actions
# tab; see code/discover-obs.sh. Never merges anything.
name: Discover apps (openSUSE Build Service)

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Maximum number of pull requests to open (0 = no limit)'
        type: number
        default: 1
      dry_run:
        description: 'Dry run (only print what would be opened; nothing is pushed or changed)'
        type: boolean
        default: false

jobs:
  discover-obs:
    if: github.repository == 'AppImage/appimage.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: discover-obs
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      # A personal token lets an opened PR's Test workflow actually start (a
      # PR opened with this workflow's own token starts none): DISCOVER_TOKEN
      # if set, else the SCREENSHOT_UPLOAD_TOKEN secret, else GITHUB_TOKEN
      # (then the PR body says to close and reopen it). See MAINTAINER.md.
      DISCOVER_TOKEN: ${{ secrets.DISCOVER_TOKEN }}
      SCREENSHOT_UPLOAD_TOKEN: ${{ secrets.SCREENSHOT_UPLOAD_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover and propose new entries
        env:
          COUNT: ${{ github.event.inputs.count || '1' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=(--count "$COUNT")
          [ "$DRY_RUN" == "true" ] && ARGS+=(--dry-run)
          bash code/discover-obs.sh "${ARGS[@]}"
