<?xml version="1.0" encoding="UTF-8"?>
<!--
  Malgel app icon (source). 1024×1024 canvas on the macOS icon grid: an
  824×824 tile with a soft shadow. Sizes up to 32 px are rendered from
  malgel-small.svg instead; run render.sh after editing either file.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C6CF7"/>
      <stop offset="1" stop-color="#4A3CD6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A59F0"/>
      <stop offset="1" stop-color="#4336CF"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1B1452" flood-opacity="0.35"/>
    </filter>
    <filter id="page-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1B1452" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tile-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- Page with a folded corner -->
  <path fill="#FFFFFF" filter="url(#page-shadow)"
        d="M312 196H622L752 326V788Q752 828 712 828H312Q272 828 272 788V236Q272 196 312 196Z"/>
  <path fill="#DCD8FB" d="M622 196L752 326H662Q622 326 622 286Z"/>

  <!-- Markdown mark: M and down arrow -->
  <path fill="url(#ink)" transform="translate(262.6 281.5) scale(2.32)"
        d="M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39zm125 0l-30-33h20V30h20v35h20z"/>

  <!-- Lines of text -->
  <g fill="#DCD8FB">
    <rect x="332" y="590" width="360" height="30" rx="15"/>
    <rect x="332" y="650" width="300" height="30" rx="15"/>
    <rect x="332" y="710" width="336" height="30" rx="15"/>
  </g>
</svg>
