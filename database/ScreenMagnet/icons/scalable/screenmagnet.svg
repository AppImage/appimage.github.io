        stroke-width="5" stroke-linecap="round"/>
  <path d="M13 28A15 15 0 0 1 28 43" fill="none" stroke="currentColor"
        stroke-width="5" stroke-linecap="round"/>
  <circle cx="13" cy="43" r="3.2" fill="currentColor"/>
</svg>
