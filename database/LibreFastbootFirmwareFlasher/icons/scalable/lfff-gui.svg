<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2a3a"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#adc6ff"/>
      <stop offset="100%" style="stop-color:#6e9fe4"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Phone outline -->
  <rect x="20" y="10" width="24" height="38" rx="4" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <!-- Phone screen -->
  <rect x="23" y="15" width="18" height="26" rx="2" fill="#adc6ff" opacity="0.15"/>
  <!-- Home button -->
  <circle cx="32" cy="44" r="2" fill="url(#accent)" opacity="0.7"/>

  <!-- Flash arrow -->
  <path d="M34 22 L29 31 L33 31 L30 40 L37 28 L33 28 Z" fill="url(#accent)" opacity="0.95"/>
</svg>
