<?xml version="1.0" encoding="UTF-8"?>
<!-- ruum's mark (C1 · Machined Monolith): sharp 90° slabs and amber Watchdog core. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151821"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#DDE4F0"/>
    </linearGradient>
    <linearGradient id="amberCore" x1="0" y1="0" x2="0" y2="1">
