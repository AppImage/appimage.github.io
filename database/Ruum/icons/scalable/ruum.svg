      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="10" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="9.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="1"/>
